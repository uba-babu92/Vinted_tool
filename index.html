<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colis Vinted</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #111; max-width: 640px; margin: auto; }
  button, input, select { font-size: 16px; padding: 10px; margin: 4px 0; }
  button { cursor: pointer; }
  .tabs button.on { font-weight: bold; text-decoration: underline; }
  .cmd { border: 2px solid #ccc; border-radius: 8px; padding: 10px; margin: 10px 0; display: flex; gap: 10px; }
  .cmd img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; }
  .num { font-size: 28px; font-weight: bold; }
  .s0 { border-color: #d33; } .s1 { border-color: #e90; } .s2 { border-color: #2a2; }
  .hidden { display: none; }
  form label { display: block; margin-top: 8px; }
  form input { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
<h2>Colis Vinted</h2>

<div class="tabs">
  <button data-f="0" class="on">À emballer</button>
  <button data-f="1">Emballé</button>
  <button data-f="2">Envoyé</button>
  <button data-f="all">Tout</button>
</div>
<button id="btnNew">+ Nouvelle vente</button>

<form id="form" class="hidden">
  <label>Photo de l'article <input type="file" id="fPhoto" accept="image/*"></label>
  <label>Nom de l'article <input id="fNom" required></label>
  <label>Pseudo de l'acheteur <input id="fPseudo" required></label>
  <button type="submit">Enregistrer</button>
  <button type="button" id="btnCancel">Annuler</button>
</form>

<div id="list"></div>

<hr>
<label>Où mettre la photo sur le bordereau :
  <select id="pos">
    <option value="br">En bas à droite</option>
    <option value="bl">En bas à gauche</option>
    <option value="tr">En haut à droite</option>
    <option value="tl">En haut à gauche</option>
    <option value="page">Sur une page à part</option>
  </select>
</label>
<input type="file" id="pdfInput" accept="application/pdf" class="hidden">

<script src="pdf-lib.min.js"></script>
<script>
const STATUTS = ['À emballer', 'Emballé', 'Envoyé'];
let filtre = '0';
let pdfFor = null;

// ---- Stockage (IndexedDB, reste sur le téléphone) ----
const dbP = new Promise((ok, ko) => {
  const r = indexedDB.open('colis-vinted', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('cmd', { keyPath: 'id' });
  r.onsuccess = () => ok(r.result);
  r.onerror = () => ko(r.error);
});
async function tx(mode, fn) {
  const db = await dbP;
  return new Promise((ok, ko) => {
    const t = db.transaction('cmd', mode);
    const req = fn(t.objectStore('cmd'));
    t.oncomplete = () => ok(req && req.result);
    t.onerror = () => ko(t.error);
  });
}
const all = () => tx('readonly', s => s.getAll());
const save = c => tx('readwrite', s => s.put(c));
const del = id => tx('readwrite', s => s.delete(id));

// ---- Photo réduite en JPEG ----
function shrink(file, max = 600) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = ko;
    img.src = URL.createObjectURL(file);
  });
}

// ---- Liste ----
async function render() {
  const cmds = (await all()).sort((a, b) => b.num - a.num);
  const list = document.getElementById('list');
  const vis = cmds.filter(c => filtre === 'all' || String(c.statut) === filtre);
  list.innerHTML = vis.length ? '' : '<p>Rien ici.</p>';
  for (const c of vis) {
    const d = document.createElement('div');
    d.className = 'cmd s' + c.statut;
    d.innerHTML = `
      ${c.photo ? `<img src="${c.photo}">` : ''}
      <div>
        <div class="num">#${c.num}</div>
        <div><b>${esc(c.nom)}</b></div>
        <div>Acheteur : ${esc(c.pseudo)}</div>
        <div>Statut : ${STATUTS[c.statut]}</div>
        <button data-a="pdf">📄 Bordereau → ajouter la photo</button>
        ${c.statut < 2 ? `<button data-a="next">✅ Passer à « ${STATUTS[c.statut + 1]} »</button>` : ''}
        ${c.statut > 0 ? `<button data-a="back">↩︎ Revenir</button>` : ''}
        <button data-a="del">🗑</button>
      </div>`;
    d.onclick = e => action(e.target.dataset.a, c);
    list.appendChild(d);
  }
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

async function action(a, c) {
  if (!a) return;
  if (a === 'next') {
    // Vérif anti-erreur avant d'avancer
    const msg = c.statut === 0
      ? `Colis #${c.num}\nArticle : ${c.nom}\n\nL'article dans le colis = celui de la photo ?\nTu as écrit #${c.num} sur le colis ?`
      : `Colis #${c.num} déposé au point relais ?`;
    if (!confirm(msg)) return;
    c.statut++;
  }
  if (a === 'back') c.statut--;
  if (a === 'del') { if (confirm(`Supprimer #${c.num} ?`)) await del(c.id); return render(); }
  if (a === 'pdf') { pdfFor = c; const i = document.getElementById('pdfInput'); i.value = ''; i.click(); return; }
  await save(c);
  render();
}

// ---- Tampon sur le bordereau PDF ----
document.getElementById('pdfInput').onchange = async e => {
  const file = e.target.files[0];
  if (!file || !pdfFor) return;
  try {
    const out = await stamp(await file.arrayBuffer(), pdfFor, document.getElementById('pos').value);
    download(out, `bordereau-${pdfFor.num}-${pdfFor.pseudo}.pdf`);
  } catch (err) { alert('Erreur PDF : ' + err.message); }
};

async function stamp(bytes, c, pos) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(bytes, { ignoreEncryption: true });
  const font = await doc.embedFont(StandardFonts.HelveticaBold);
  const img = c.photo ? await doc.embedJpg(c.photo) : null;

  const W = 200, H = 120, M = 15;
  let page, x, y;
  if (pos === 'page') {
    const size = doc.getPage(0).getSize();
    page = doc.addPage([size.width, size.height]);
    x = (size.width - W) / 2; y = size.height - H - 60;
  } else {
    page = doc.getPage(0);
    const { width, height } = page.getSize();
    x = pos[1] === 'r' ? width - W - M : M;
    y = pos[0] === 'b' ? M : height - H - M;
  }
  page.drawRectangle({ x, y, width: W, height: H, color: rgb(1, 1, 1), borderColor: rgb(0, 0, 0), borderWidth: 2 });
  if (img) {
    const s = Math.min(100 / img.width, 100 / img.height);
    page.drawImage(img, { x: x + 10, y: y + 10 + (100 - img.height * s) / 2, width: img.width * s, height: img.height * s });
  }
  const tx0 = x + 118;
  page.drawText('#' + c.num, { x: tx0, y: y + H - 40, size: 30, font });
  page.drawText(cut(clean(c.nom), 14), { x: tx0, y: y + 45, size: 9, font });
  page.drawText(cut(clean(c.pseudo), 14), { x: tx0, y: y + 25, size: 9, font });
  return doc.save();
}
// La police PDF de base ne gère pas les emojis : on les retire.
const clean = s => String(s).replace(/[^\x20-\x7E -ÿ]/g, '');
const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '.' : s;

function download(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ---- Formulaire ----
const form = document.getElementById('form');
document.getElementById('btnNew').onclick = () => form.classList.remove('hidden');
document.getElementById('btnCancel').onclick = () => { form.reset(); form.classList.add('hidden'); };
form.onsubmit = async e => {
  e.preventDefault();
  const f = document.getElementById('fPhoto').files[0];
  const cmds = await all();
  await save({
    id: Date.now().toString(36),
    num: cmds.reduce((m, c) => Math.max(m, c.num), 0) + 1,
    nom: document.getElementById('fNom').value.trim(),
    pseudo: document.getElementById('fPseudo').value.trim(),
    photo: f ? await shrink(f) : null,
    statut: 0,
    date: new Date().toISOString(),
  });
  form.reset(); form.classList.add('hidden');
  render();
};

// ---- Onglets + réglage ----
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filtre = b.dataset.f; render();
});
const pos = document.getElementById('pos');
try { pos.value = localStorage.getItem('pos') || 'br'; } catch {}
pos.onchange = () => { try { localStorage.setItem('pos', pos.value); } catch {} };

render();
</script>
</body>
</html>
